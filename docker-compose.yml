services:
  postgres:
    image: postgres:16-alpine
    container_name: hostel_complaints_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hostel_admin
      POSTGRES_PASSWORD: hostel_admin
      POSTGRES_DB: hostel_complaints
    ports:
      - "5432:5432"
    volumes:
      - hostel_complaints_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostel_admin -d hostel_complaints"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hostel_complaints_pgdata:
